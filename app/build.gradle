plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yashg.electricity'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yashg.electricity'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Kept unminified: the WebView bridge methods are called by name from JavaScript.
            minifyEnabled false
            // Sideloaded over ADB only, never published.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
